<mat-toolbar class="bg-dark-subtle fw-semibold">
  <div class="w-100 navbar align-items-center justify-content-between">
    <div class="d-flex">
      <div class="justify-content-center align-items-center d-flex">
        <button
          class="btn navbar-toggler-icon ms-2 me-3"
          (click)="sidenav.toggle()"
        ></button>
      </div>
      <div class="navbar-brand">
        <img
          width="65px"
          class="w-sm-75"
          src="Bannari_Amman_Institute_of_Technology_logo.png"
          alt="BIT Logo"
        />
      </div>
      <div class="d-flex align-items-center justify-content-center">
        <h2 class="navbar-text">Grievance Portal</h2>
      </div>
    </div>
    <div></div>
    <div class="text-end">
      <button id="logoutBtn" (click)="logout()" class="btn btn-outline-danger btn-md">
        <i class="bi bi-box-arrow-right me-2"></i>Logout
      </button>
    </div>
  </div>
</mat-toolbar>
<mat-sidenav-container class="bg-transparent">
  <mat-sidenav #sidenav class="m-4 rounded-4 bg-dark-subtle">
    <mat-nav-list class="m-2">
      <a
        mat-list-item
        class="m-1 pointer-event rounded-2 text-black-50 fw-semibold w-100"
        *ngFor="let route of routes"
        [routerLink]="route.path"
      >
      <i [classList]="route.class"></i>
        {{ route.routeName }}
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content style="height: 100%;">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
