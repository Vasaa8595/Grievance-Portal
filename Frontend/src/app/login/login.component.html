<div
  class="eef2f6 w-lg-100 w-md-75 d-flex flex-column justify-content-center align-items-center vh-100"
>
  <div class="bg-white p-4 rounded-4 bg-white">
    <div class="d-flex flex-column align-items-center">
      <img
        src="Bannari_Amman_Institute_of_Technology_logo.png"
        alt="bit"
        width="100px"
      />
      <h1>Grievance Portal</h1>
      <h3>Welcome Back!</h3>
    </div>
    <form [formGroup]="loginForm" class="row" >
      <div class="form-group">
        <label for="user-id">Reg-Number</label>
        <input formControlName="regId" id="user-id" class="form-control" placeholder="Reg-Number" />
      </div>
      <div class="form-group mt-3">
        <label for="password">Password</label>
        <input formControlName="password" id="password" class="form-control" placeholder="Password" />
      </div>
      <button (click)="submit()" type="submit" class="d-block btn btn-primary w-100 mt-3">Log In</button>
    </form>
    <div *ngIf="!isValid" style="height: 55px;" class="mt-4 alert alert-warning alert-dismissible fade show" role="alert">
      <p>All fields are required</p>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
        (click)="this.isValid = true"
      ></button>
    </div>
        <div class="mt-3 d-flex flex-column align-items-center">
      <div id="google-btn"></div>
    </div>
  </div>
</div>
